# Netlify configuratie — MrGolfbal.nl headless frontend
[build]
  publish = "."
  command = "node gen.mjs && node build-preview.mjs || true"

[build.environment]
  NODE_VERSION = "22"

# Security & performance headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Pretty URLs met trailing slash worden door de mapstructuur (/slug/index.html) afgehandeld.
# Redirects staan in ./_redirects (Netlify leest dat bestand automatisch).

# Shopify checkout/cart blijven op het Shopify-domein (bron van waarheid).
# Voorbeeld proxy naar Shopify checkout indien gewenst:
# [[redirects]]
#   from = "/cart"
#   to = "https://mrgolfbal.myshopify.com/cart"
#   status = 302
#   force = true
